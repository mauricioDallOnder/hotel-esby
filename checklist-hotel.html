<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1565c0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <title>Checklist Hôtel</title>

  <style>
    :root {
      --primary: #1565c0;
      --primary-dark: #0d47a1;
      --primary-soft: #e3f2fd;
      --success: #2e7d32;
      --success-soft: #e8f5e9;
      --warning: #ed6c02;
      --warning-soft: #fff4e5;
      --text: #1f2937;
      --muted: #667085;
      --border: #e4e7ec;
      --surface: #ffffff;
      --background: #f4f6f8;
      --shadow: 0 8px 24px rgba(16, 24, 40, 0.10);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--background);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overscroll-behavior-y: contain;
    }

    button,
    .task {
      touch-action: manipulation;
    }

    .app {
      width: 100%;
      max-width: 620px;
      min-height: 100dvh;
      margin: 0 auto;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
    }

    .safe-top {
      height: env(safe-area-inset-top);
      background: var(--primary);
    }

    .header {
      padding: 20px 18px 34px;
      color: white;
      background: linear-gradient(145deg, var(--primary), var(--primary-dark));
    }

    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .eyebrow {
      margin: 0 0 4px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.4px;
      opacity: 0.82;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.15;
      letter-spacing: -0.4px;
    }

    .date {
      margin-top: 7px;
      font-size: 14px;
      opacity: 0.92;
    }

    .clock {
      flex: 0 0 auto;
      min-width: 66px;
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .progress-card {
      position: relative;
      z-index: 2;
      margin: -16px 14px 20px;
      padding: 17px;
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 11px;
    }

    .progress-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .progress-count {
      margin-top: 2px;
      font-size: 19px;
      font-weight: 800;
    }

    .percent {
      padding: 6px 10px;
      border: 1px solid #90caf9;
      border-radius: 999px;
      color: var(--primary);
      background: #f8fbff;
      font-size: 13px;
      font-weight: 800;
    }

    .percent.complete {
      border-color: #a5d6a7;
      color: var(--success);
      background: var(--success-soft);
    }

    .track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #e9eef4;
    }

    .bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
      transition: width .25s ease;
    }

    .bar.complete {
      background: var(--success);
    }

    .content {
      padding: 0 14px;
    }

    .section {
      margin-bottom: 22px;
    }

    .section-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 0 2px 10px;
    }

    h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.15px;
    }

    .section-chip {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: white;
      font-size: 11px;
      font-weight: 700;
    }

    .list {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .task {
      position: relative;
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 4px;
      min-height: 78px;
      padding: 15px 14px 15px 12px;
      cursor: pointer;
      user-select: none;
    }

    .task + .task {
      border-top: 1px solid var(--border);
    }

    .task:active {
      background: #f7f9fc;
    }

    .check-wrap {
      display: flex;
      justify-content: center;
      padding-top: 1px;
    }

    .check {
      position: relative;
      width: 24px;
      height: 24px;
      border: 2px solid #98a2b3;
      border-radius: 6px;
      background: white;
      transition: .16s ease;
    }

    .task.done .check {
      border-color: var(--primary);
      background: var(--primary);
    }

    .task.done .check::after {
      content: "";
      position: absolute;
      left: 7px;
      top: 3px;
      width: 6px;
      height: 11px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .task-main {
      min-width: 0;
    }

    .task-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 6px;
    }

    .time-chip,
    .bin-chip {
      display: inline-flex;
      align-items: center;
      min-height: 23px;
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
    }

    .time-chip {
      color: white;
      background: var(--primary);
    }

    .bin-chip {
      border: 1px solid var(--border);
      color: #344054;
      background: #f9fafb;
    }

    .task-title {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.35;
    }

    .task-detail {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.42;
    }

    .task.done .task-title {
      text-decoration: line-through;
      color: #7b8492;
    }

    .task.done .task-detail {
      color: #a0a7b1;
    }

    .task.done .time-chip {
      color: var(--muted);
      background: #eef1f4;
    }

    .bin-notice {
      padding: 15px;
      border: 1px solid #ffcc80;
      border-radius: var(--radius);
      background: var(--warning-soft);
      color: #7a4100;
      font-size: 14px;
      line-height: 1.45;
    }

    .bin-notice strong {
      color: #5c3000;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .button.secondary {
      border: 1px solid var(--border);
      color: var(--primary);
      background: white;
    }

    .footer {
      padding: 4px 22px 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom));
      z-index: 20;
      max-width: calc(100vw - 28px);
      padding: 11px 15px;
      border-radius: 999px;
      color: white;
      background: #202124;
      box-shadow: 0 8px 26px rgba(0,0,0,.22);
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 16px);
      transition: .22s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (min-width: 620px) {
      body {
        padding: 22px 0;
      }

      .app {
        overflow: hidden;
        min-height: calc(100dvh - 44px);
        border-radius: 24px;
        box-shadow: 0 18px 55px rgba(16,24,40,.13);
      }
    }

    @media (max-width: 370px) {
      .header {
        padding-left: 15px;
        padding-right: 15px;
      }

      h1 {
        font-size: 24px;
      }

      .content,
      .progress-card {
        margin-left: 10px;
        margin-right: 10px;
      }

      .content {
        padding-left: 0;
        padding-right: 0;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="safe-top"></div>

    <header class="header">
      <div class="header-top">
        <div>
          <p class="eyebrow">TRAVAIL · HÔTEL</p>
          <h1>Checklist du jour</h1>
          <div class="date" id="dateText">—</div>
        </div>
        <div class="clock" id="clock">--:--</div>
      </div>
    </header>

    <section class="progress-card" aria-label="Progression">
      <div class="progress-row">
        <div>
          <div class="progress-label">Progression</div>
          <div class="progress-count" id="progressCount">0 / 0 tâches</div>
        </div>
        <div class="percent" id="percent">0 %</div>
      </div>
      <div class="track">
        <div class="bar" id="progressBar"></div>
      </div>
    </section>

    <div class="content">
      <section class="section">
        <div class="section-title-row">
          <h2>À faire chaque jour</h2>
          <span class="section-chip">Arrivée</span>
        </div>
        <div class="list" id="dailyList"></div>
      </section>

      <section class="section">
        <div class="section-title-row">
          <h2>Poubelles</h2>
          <span class="section-chip" id="weekdayChip">Aujourd'hui</span>
        </div>
        <div id="binArea"></div>
      </section>

      <div class="actions">
        <button type="button" class="button secondary" id="resetButton">Réinitialiser aujourd'hui</button>
      </div>
    </div>

    <p class="footer">
      Les coches sont enregistrées sur cet appareil pour la journée en cours.
      La liste s'adapte automatiquement au jour de la semaine.
    </p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">Toutes les tâches sont terminées ✓</div>

  <script>
    // =========================================================
    // TÂCHES - vous pouvez modifier les textes ici si nécessaire
    // =========================================================

    const DAILY_TASKS = [
      {
        id: "open-kitchen-room-oven-storage",
        time: "08:00",
        title: "Ouvrir la cuisine, la chambre four et la réserve",
        detail: "Première tâche à l'arrivée."
      },
      {
        id: "open-reception",
        title: "Ouvrir la réception",
        detail: "À faire juste après l'ouverture des premiers locaux."
      },
      {
        id: "check-kitchen-premises-hobs",
        title: "Vérifier la cuisine, Ouvrir le locaux des plaques",
        detail: "Faire un contrôle rapide de l'état des lieux."
      },
      {
        id: "check-outdoor-tank-temperature",
        title: "Vérifier la température du ballon à l'extérieur",
        detail: "Envoyer a foto et registrer dans le feuille de control ATENTION le BALLON 3 est le ballon 1"
      },
      {
        id: "check-bins",
        title: "Vérifier les 5 poubelles",
        detail: "Contrôler les bacs et suivre la consigne spéciale du jour ci-dessous."
      },
      {
        id: "check-resident-software",
        title: "Vérifier le logiciel des résidents",
        detail: "Contrôler les informations et les éventuelles mises à jour."
      }
    ];

    // JavaScript getDay(): dimanche=0, lundi=1, mardi=2, mercredi=3...
    const BIN_TASKS_BY_WEEKDAY = {
      1: [
        {
          id: "monday-black-bin-out",
          time: "21:00",
          bin: "Bac noir",
          title: "Sortir le bac noir",
          detail: "Le placer devant la porte 3, sur le côté, sans bloquer la porte."
        }
      ],
      2: [
        {
          id: "tuesday-black-bin-in-clean",
          time: "08:00",
          bin: "Bac noir",
          title: "Rentrer le bac et le nettoyer",
          detail: "Après la sortie du bac noir du lundi soir."
        }
      ],
      3: [
        {
          id: "wednesday-yellow-bin-out",
          time: "21:00",
          bin: "Bac jaune",
          title: "Sortir le bac jaune",
          detail: "Le placer devant la porte 3, au même endroit, sans bloquer la porte."
        }
      ]
    };

    const state = {
      now: new Date(),
      checks: {},
      dateKey: ""
    };

    const $ = (selector) => document.querySelector(selector);

    const dailyList = $("#dailyList");
    const binArea = $("#binArea");
    const dateText = $("#dateText");
    const clock = $("#clock");
    const progressCount = $("#progressCount");
    const percent = $("#percent");
    const progressBar = $("#progressBar");
    const weekdayChip = $("#weekdayChip");
    const resetButton = $("#resetButton");
    const toast = $("#toast");

    function localDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function storageKey(dateKey) {
      return `hotel-checklist:${dateKey}`;
    }

    function loadChecks(dateKey) {
      try {
        return JSON.parse(localStorage.getItem(storageKey(dateKey)) || "{}");
      } catch (error) {
        return {};
      }
    }

    function saveChecks() {
      try {
        localStorage.setItem(storageKey(state.dateKey), JSON.stringify(state.checks));
      } catch (error) {
        // Le fichier continue à fonctionner même si le navigateur bloque localStorage.
      }
    }

    function capitalize(text) {
      return text ? text.charAt(0).toUpperCase() + text.slice(1) : text;
    }

    function formatDate(date) {
      return capitalize(new Intl.DateTimeFormat("fr-FR", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      }).format(date));
    }

    function formatWeekday(date) {
      return capitalize(new Intl.DateTimeFormat("fr-FR", {
        weekday: "long"
      }).format(date));
    }

    function formatTime(date) {
      return new Intl.DateTimeFormat("fr-FR", {
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function getBinTasks() {
      return BIN_TASKS_BY_WEEKDAY[state.now.getDay()] || [];
    }

    function getAllTasks() {
      return [...DAILY_TASKS, ...getBinTasks()];
    }

    function taskElement(task) {
      const done = Boolean(state.checks[task.id]);

      const row = document.createElement("div");
      row.className = `task${done ? " done" : ""}`;
      row.setAttribute("role", "checkbox");
      row.setAttribute("aria-checked", String(done));
      row.setAttribute("tabindex", "0");
      row.dataset.id = task.id;

      const chips = [];
      if (task.time) chips.push(`<span class="time-chip">${escapeHtml(task.time)}</span>`);
      if (task.bin) chips.push(`<span class="bin-chip">${escapeHtml(task.bin)}</span>`);

      row.innerHTML = `
        <div class="check-wrap"><span class="check" aria-hidden="true"></span></div>
        <div class="task-main">
          <div class="task-heading">
            ${chips.join("")}
            <span class="task-title">${escapeHtml(task.title)}</span>
          </div>
          <div class="task-detail">${escapeHtml(task.detail || "")}</div>
        </div>
      `;

      const toggle = () => toggleTask(task.id);
      row.addEventListener("click", toggle);
      row.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          toggle();
        }
      });

      return row;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderLists() {
      dailyList.innerHTML = "";
      DAILY_TASKS.forEach(task => dailyList.appendChild(taskElement(task)));

      const binTasks = getBinTasks();
      binArea.innerHTML = "";

      if (binTasks.length) {
        const list = document.createElement("div");
        list.className = "list";
        binTasks.forEach(task => list.appendChild(taskElement(task)));
        binArea.appendChild(list);
      } else {
        const notice = document.createElement("div");
        notice.className = "bin-notice";
        notice.innerHTML = `<strong>Aucune sortie spéciale aujourd'hui.</strong><br>
          Lundi : bac noir à 21h · Mardi : rentrer/nettoyer à 8h · Mercredi : bac jaune à 21h.`;
        binArea.appendChild(notice);
      }

      weekdayChip.textContent = formatWeekday(state.now);
      updateProgress();
    }

    function toggleTask(id) {
      state.checks[id] = !state.checks[id];
      saveChecks();
      renderLists();
    }

    let toastTimer;
    function showToast() {
      clearTimeout(toastTimer);
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2300);
    }

    function updateProgress() {
      const tasks = getAllTasks();
      const completed = tasks.filter(task => state.checks[task.id]).length;
      const total = tasks.length;
      const value = total ? Math.round((completed / total) * 100) : 0;
      const complete = total > 0 && completed === total;

      progressCount.textContent = `${completed} / ${total} tâches`;
      percent.textContent = complete ? "Terminé" : `${value} %`;
      percent.classList.toggle("complete", complete);
      progressBar.style.width = `${value}%`;
      progressBar.classList.toggle("complete", complete);

      if (complete) showToast();
    }

    function refreshDateAndTime() {
      const fresh = new Date();
      const freshKey = localDateKey(fresh);
      const dayChanged = freshKey !== state.dateKey;

      state.now = fresh;
      dateText.textContent = formatDate(fresh);
      clock.textContent = formatTime(fresh);

      if (dayChanged) {
        state.dateKey = freshKey;
        state.checks = loadChecks(freshKey);
        renderLists();
      }
    }

    resetButton.addEventListener("click", () => {
      const confirmed = window.confirm("Réinitialiser toutes les tâches cochées d'aujourd'hui ?");
      if (!confirmed) return;
      state.checks = {};
      saveChecks();
      renderLists();
    });

    // Initialisation
    state.dateKey = localDateKey(state.now);
    state.checks = loadChecks(state.dateKey);
    dateText.textContent = formatDate(state.now);
    clock.textContent = formatTime(state.now);
    renderLists();

    // Mise à jour de l'heure et détection automatique d'un changement de jour.
    setInterval(refreshDateAndTime, 30000);
  </script>
</body>
</html>
